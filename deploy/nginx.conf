# /etc/nginx/sites-available/slr
# 启用:ln -sf /etc/nginx/sites-available/slr /etc/nginx/sites-enabled/slr
# 测试:nginx -t && systemctl reload nginx
# 后续 certbot --nginx 会自动追加 443 段 + 80→443 跳转
#
# ⚠️ 重要:**生产服务器上的此文件已被 certbot 改过**(443/SSL server block 追加在末尾)。
# 不要无脑用本文件覆盖 /etc/nginx/sites-available/slr — 会把 443 配置丢掉,导致 HTTPS 503。
# 如需改 80 段(比如 client_max_body_size 1100m),手工 SSH 编辑 prod 文件 + nginx -t + reload。
# 误覆盖恢复:certbot install --cert-name slr.yourai.asia --nginx --redirect

server {
    listen 80;
    listen [::]:80;
    server_name slr.yourai.asia;

    # Zotero RDF zip 可能很大(200 篇 PDF 综述项目可达 600 MB - 1.2 GB)
    client_max_body_size 1100m;

    # Claude CLI 调用可能要 1-3 分钟,长任务通道。
    # B4.6:对齐 Node 内 LLM_TIMEOUT_MAX(8 min = 480s)+ 120s 缓冲 = 600s。
    # 旧值 3600s 太长 —— Node 已主动 abort 的请求,nginx 还在等,占连接数;
    # 反过来如果 Node 卡住 480s+,nginx 主动 504 让客户端早点放弃也比挂死好。
    # ⚠️ 本地改完后**不要 rsync 覆盖 prod**(certbot 在 prod 的 443 段)。
    # 改 prod:ssh + 手编 /etc/nginx/sites-available/slr + nginx -t + reload
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_connect_timeout 30s;

    # 防 "upstream sent too big header" 502 —— 长 flash / large
    # Set-Cookie / 偶发大响应头时 8K 默认值会爆。LLM 输出会进 DB 不进
    # cookie,但兜底设大。
    proxy_buffer_size 64k;
    proxy_buffers 16 64k;
    proxy_busy_buffers_size 128k;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
