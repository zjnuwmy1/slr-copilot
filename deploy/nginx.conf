# /etc/nginx/sites-available/slr
# 启用:ln -sf /etc/nginx/sites-available/slr /etc/nginx/sites-enabled/slr
# 测试:nginx -t && systemctl reload nginx
# 后续 certbot --nginx 会自动追加 443 段 + 80→443 跳转

server {
    listen 80;
    listen [::]:80;
    server_name slr.yourai.asia;

    # Zotero RDF zip 可能较大
    client_max_body_size 200m;

    # Claude CLI 调用可能要 1-3 分钟,长任务通道
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 30s;

    # 防 "upstream sent too big header" 502 —— 长 flash / large
    # Set-Cookie / 偶发大响应头时 8K 默认值会爆。LLM 输出会进 DB 不进
    # cookie,但兜底设大。
    proxy_buffer_size 64k;
    proxy_buffers 16 64k;
    proxy_busy_buffers_size 128k;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
